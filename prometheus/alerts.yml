# Regras de alerta do Prometheus.
groups:
  - name: disponibilidade-servicos
    rules:
      - alert: ServicoForaDoAr
        expr: probe_success == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "Serviço {{ $labels.instance }} está fora do ar"
          description: "O serviço {{ $labels.instance }} não respondeu ao probe (tcp_connect) por mais de 1 minuto."
