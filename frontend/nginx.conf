server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/plain application/javascript application/json text/css;

    # Roteamento do Angular (SPA) — qualquer rota desconhecida cai no index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Proxy reverso: /api/... vai pro backend FastAPI PRESERVANDO o caminho.
    # IMPORTANTE: sem barra final no proxy_pass. Assim /api/status chega no backend
    # como /api/status (que é a rota real). Com a barra final, chegaria como /status
    # e daria 404.
    location /api/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
}
